<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Better USACO Settings</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div class="container">
            <header>
                <h1>Better USACO</h1>
            </header>

            <main>
                <!-- Global Toggle -->
                <section class="setting-section">
                    <div class="setting-row">
                        <label for="enabled" class="setting-label">
                            <span class="label-text">Enable Extension</span>
                            <span class="label-description"
                                >Turn extension on/off</span
                            >
                        </label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="enabled" checked />
                            <span class="slider"></span>
                        </label>
                    </div>
                </section>

                <!-- Dark Mode Toggle -->
                <section class="setting-section">
                    <div class="setting-row">
                        <label for="darkMode" class="setting-label">
                            <span class="label-text">Dark Mode</span>
                            <span class="label-description"
                                >Switch to dark theme</span
                            >
                        </label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="darkMode" />
                            <span class="slider"></span>
                        </label>
                    </div>
                </section>

                <!-- Sample Box Style Toggle -->
                <section class="setting-section">
                    <div class="setting-row">
                        <label for="enhancedSamples" class="setting-label">
                            <span class="label-text">Styled Sample I/O</span>
                            <span class="label-description"
                                >Off uses the original USACO style</span
                            >
                        </label>
                        <label class="toggle-switch">
                            <input
                                type="checkbox"
                                id="enhancedSamples"
                                checked
                            />
                            <span class="slider"></span>
                        </label>
                    </div>
                </section>

                <!-- Contrast Slider -->
                <section class="setting-section">
                    <div class="setting-row">
                        <label for="contrast" class="setting-label">
                            <span class="label-text">Contrast</span>
                        </label>
                        <div class="slider-container">
                            <input
                                type="range"
                                id="contrast"
                                min="0"
                                max="200"
                                value="100"
                                class="slider-input"
                            />
                            <span class="slider-value" id="contrastValue"
                                >100%</span
                            >
                        </div>
                    </div>
                </section>

                <!-- Grayscale Slider -->
                <section class="setting-section">
                    <div class="setting-row">
                        <label for="grayscale" class="setting-label">
                            <span class="label-text">Grayscale</span>
                        </label>
                        <div class="slider-container">
                            <input
                                type="range"
                                id="grayscale"
                                min="0"
                                max="100"
                                value="0"
                                class="slider-input"
                            />
                            <span class="slider-value" id="grayscaleValue"
                                >0%</span
                            >
                        </div>
                    </div>
                </section>

                <!-- Invert Slider -->
                <section class="setting-section">
                    <div class="setting-row">
                        <label for="invert" class="setting-label">
                            <span class="label-text">Invert</span>
                        </label>
                        <div class="slider-container">
                            <input
                                type="range"
                                id="invert"
                                min="0"
                                max="100"
                                value="0"
                                class="slider-input"
                            />
                            <span class="slider-value" id="invertValue"
                                >0%</span
                            >
                        </div>
                    </div>
                </section>
            </main>

            <footer>
                <p class="footer-text">Settings are saved automatically</p>
            </footer>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
